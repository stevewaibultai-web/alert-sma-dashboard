<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Trading Alert Dashboard</title>
  <style>
    body { background:#0b1426; color:#fff; font-family:Segoe UI; text-align:center; padding:20px; }
    input, select { background-color:#1e2a3a; color:#fff; border:1px solid #3a4a5a; padding:4px; }
    button { background-color:#1e2a3a; color:#fff; border:1px solid #3a4a5a; padding:6px 12px; cursor:pointer; }
    button:hover { background-color:#2c3b4d; }
    table { border-collapse:collapse; width:100%; }
    table td, table th { border:1px solid #3a4a5a; padding:6px; }
  </style>
</head>
<body>
  <h2>Trading Alert Dashboard</h2>

  <table>
    <tr style="background:#132240; color:#8fa0c2;">
      <th>Symbol</th><th>Exchange</th><th>Indicator</th><th>Timeframe</th><th>Current Price</th><th>Alert</th>
    </tr>
    <script>
      const symbols = [
        {sym:"BTCUSDT", exch:"binance"},
        {sym:"ETHUSDT", exch:"binance"},
        {sym:"NILUSDTM", exch:"shark"},
        {sym:"TUTUSDTM", exch:"shark"},
        {sym:"STXUSDTM", exch:"shark"},
        {sym:"COOKIEUSDTM", exch:"shark"}
      ];
      symbols.forEach((s,i)=>{
        document.write(`
          <tr>
            <td><input type="text" id="sym${i}" value="${s.sym}" onchange="saveSettings(${i}); initRow(${i})"></td>
            <td><select id="exch${i}" onchange="saveSettings(${i}); initRow(${i})">
              <option ${s.exch==="binance"?"selected":""}>binance</option>
              <option ${s.exch==="shark"?"selected":""}>shark</option>
            </select></td>
            <td><select id="ind${i}" onchange="saveSettings(${i}); initRow(${i})">
              <option>MACD</option><option>SMA Alerts</option>
            </select></td>
            <td><select id="tf${i}" onchange="saveSettings(${i}); initRow(${i})">
              <option>1m</option><option>3m</option><option>5m</option><option>15m</option>
            </select></td>
            <td id="price${i}" style="color:#0ecb81;">Loading...</td>
            <td><button onclick="sendTelegramAlert(${i}, 'Manual Alert')">Send Alert</button></td>
          </tr>
        `);
      });
    </script>
  </table>

  <div id="status" style="margin-top:20px; font-size:14px; color:#0ecb81;"></div>

  <script>
    // Telegram Bot Token & Chat ID
    const BOT_TOKEN = "8910250156:AAFXETIQy7ILusg--h5FE1PKg-dLFgS7hpg"; 
    const CHAT_ID = "7287275405";

    function sendTelegramAlert(i, msg="Alert") {
      let sym = document.getElementById(`sym${i}`).value;
      let timeframe = document.getElementById(`tf${i}`).value;
      let exch = document.getElementById(`exch${i}`).value;
      let now = new Date();
      let timeStr = now.toLocaleTimeString("en-IN",{hour12:false});
      let fullMsg = `${exch} | ${msg}: ${sym} | TF: ${timeframe} | Candle Close: ${timeStr}`;
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(fullMsg)}`)
        .then(res=>res.json())
        .then(data=>{ document.getElementById("status").innerText="Message sent ✅"; })
        .catch(err=>{ document.getElementById("status").innerText="Error ❌"; });
    }

    async function fetchCandles(symbol, tf="1m", exch="binance") {
      if(exch==="shark") {
        const res = await fetch("https://api.sharkexchange.com/v1/market/klines", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ pair:symbol, interval:tf, priceType:"MARK_PRICE", limit:100 })
        });
        const data = await res.json();
        return data.map(c=>parseFloat(c.close));
      } else {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=1000`);
        const data = await res.json();
        return data.map(c=>parseFloat(c[4]));
      }
    }

    async function fetchCrypto(i, symbol, tf="1m", exch="binance") {
      try {
        let url = exch==="shark" 
          ? `https://api.sharkexchange.com/v1/market/ticker/price?pair=${symbol}`
          : `https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`;
        const res = await fetch(url);
        const data = await res.json();
        if(data.price) {
          document.getElementById(`price${i}`).innerText = `$ ${parseFloat(data.price).toLocaleString()}`;
        } else {
          document.getElementById(`price${i}`).innerText = "Error";
        }
      } catch(e) {
        document.getElementById(`price${i}`).innerText = "Error";
      }
    }

    // EMA, SMA, MACD, SMA Alerts functions remain same as before

    function saveSettings(i){
      let sym=document.getElementById(`sym${i}`).value;
      let ind=document.getElementById(`ind${i}`).value;
      let tf=document.getElementById(`tf${i}`).value;
      let exch=document.getElementById(`exch${i}`).value;
      localStorage.setItem(`row${i}`,JSON.stringify({sym,ind,tf,exch}));
    }
    function loadSettings(i){
      let data=localStorage.getItem(`row${i}`);
      if(data){
        let {sym,ind,tf,exch}=JSON.parse(data);
        document.getElementById(`sym${i}`).value=sym;
        document.getElementById(`ind${i}`).value=ind;
        document.getElementById(`tf${i}`).value=tf;
        document.getElementById(`exch${i}`).value=exch;
      }
    }

    let intervals={};
    function initRow(i){
      if(intervals[i]) clearInterval(intervals[i]);
      let sym=document.getElementById(`sym${i}`).value.toUpperCase().trim();
      let tf=document.getElementById(`tf${i}`).value;
      let ind=document.getElementById(`ind${i}`).value;
      let exch=document.getElementById(`exch${i}`).value;
      intervals[i]=setInterval(()=>{
        fetchCrypto(i,sym,tf,exch);
        if(ind==="MACD") checkMACD(i,sym,tf,exch);
        else if(ind==="SMA Alerts") checkSMAAlerts(i,sym,tf,exch);
      },10000);
    }

    window.onload=()=>{
      symbols.forEach((s,i)=>{
        loadSettings(i);
        initRow(i);
      });
    };
  </script>
</body>
</html>
