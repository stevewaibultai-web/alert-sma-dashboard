<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Trading Alert Dashboard</title>
  <style>
    body {
      background:#0b1426; 
      color:#fff; 
      font-family:Segoe UI; 
      text-align:center; 
      padding:20px;
    }
    input, select {
      background-color: #1e2a3a;   /* dark background */
      color: #ffffff;              /* white text */
      border: 1px solid #3a4a5a;   /* subtle gray border */
      padding: 4px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
table td, table th {
      border: 1px solid #3a4a5a;   /* dark border */
      padding: 6px;
    }
  </style>
</head>
<body>
  <h2>Trading Alert Dashboard</h2>

  <table>
    <tr style="background:#132240; color:#8fa0c2;">
      <th>Symbol</th>
      <th>Indicator</th>
      <th>Timeframe</th>
      <th>Current Price</th>
      <th>Alert</th>
    </tr>
    <script>
      const symbols = [
        "NILUSDT","TUTUSDT","STXUSDT","COOKIEUSDT","TSTUSDT","THEUSDT","XAIUSDT",
        "BANANAS31USDT","COTIUSDT","BANDUSDT","ACEUSDT","STXUSDT","ADAUSDT",
        "FFUSDT","DOGEUSDT","MATICUSDT"
      ];
      symbols.forEach((sym, i) => {
        document.write(`
          <tr>
            <td><input type="text" id="sym${i}" value="${sym}" onchange="saveSettings(${i}); initRow(${i})"></td>
            <td><select id="ind${i}" onchange="saveSettings(${i}); initRow(${i})">
              <option>MACD</option>
              <option>SMA Alerts</option>
            </select></td>
            <td><select id="tf${i}" onchange="saveSettings(${i}); initRow(${i})">
              <option>1m</option><option>3m</option><option>5m</option><option>15m</option>
            </select></td>
            <td id="price${i}" style="color:#0ecb81;">Loading...</td>
            <td><button onclick="sendTelegramAlert(${i}, 'Manual Alert')">Send Alert</button></td>
          </tr>
        `);
      });
    </script>
  </table>

  <div id="status" style="margin-top:20px; font-size:14px; color:#0ecb81;"></div>

  <script>
    const BOT_TOKEN = "8910250156:AAFXETIQy7ILusg--h5FE1PKg-dLFgS7hpg"; 
    const CHAT_ID = "7287275405";

    function sendTelegramAlert(i, msg="Alert") {
      let sym = document.getElementById(`sym${i}`).value;
      let timeframe = document.getElementById(`tf${i}`).value;
      let now = new Date();
      let timeStr = now.toLocaleTimeString("en-IN", { hour12: false });
      let fullMsg = `trade2 | ${msg}: ${sym} | TF: ${timeframe} | Candle Close: ${timeStr}`;
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(fullMsg)}`)
        .then(res => res.json())
        .then(data => { document.getElementById("status").innerText = "Message sent ✅"; })
        .catch(err => { document.getElementById("status").innerText = "Error ❌"; });
    }

    async function fetchCandles(symbol, tf="1m") {
      const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=1000`);
      const data = await res.json();
      return data.map(c => parseFloat(c[4]));
    }

    function EMA(values, period) {
      let k = 2/(period+1), emaArray = [];
      emaArray[0] = values[0];
      for(let i=1;i<values.length;i++){
        emaArray[i] = values[i]*k + emaArray[i-1]*(1-k);
      }
      return emaArray;
    }

    function SMA(values, period) {
      let result = [];
      for(let i=0;i<values.length;i++){
        if(i<period) result.push(values[i]);
        else {
          let sum=0;
          for(let j=i-period+1;j<=i;j++) sum+=values[j];
          result.push(sum/period);
        }
      }
      return result;
    }

    async function checkMACD(i, symbol, tf="1m") {
      let closes = await fetchCandles(symbol, tf);
      if(closes.length < 30) return;
      let ema12 = EMA(closes, 12);
      let ema26 = EMA(closes, 26);
      let macdLine = ema12.map((v, idx) => v - ema26[idx]);
      let signalLine = EMA(macdLine, 9);
      let lastMacd = macdLine[macdLine.length-1], prevMacd = macdLine[macdLine.length-2];
      let lastSignal = signalLine[signalLine.length-1], prevSignal = signalLine[signalLine.length-2];
      if(prevMacd < prevSignal && lastMacd > lastSignal) sendTelegramAlert(i, "MACD Bullish Crossover");
      else if(prevMacd > prevSignal && lastMacd < lastSignal) sendTelegramAlert(i, "MACD Bearish Crossover");
    }

    async function checkSMAAlerts(i, symbol, tf="1m") {
  let closes = await fetchCandles(symbol, tf);
  if(closes.length < 900) return;

  let sma5   = SMA(closes, 5);   // Short line
  let sma60  = SMA(closes, 60);  // Blue line
  let sma180 = SMA(closes, 180); // Orange line
  let sma900 = SMA(closes, 900); // Purple line

  let last5 = sma5[sma5.length-1], prev5 = sma5[sma5.length-2];
  let last60 = sma60[sma60.length-1], prev60 = sma60[sma60.length-2];
  let last180 = sma180[sma180.length-1], prev180 = sma180[sma180.length-2];
  let last900 = sma900[sma900.length-1], prev900 = sma900[sma900.length-2];

  // 5 vs 180 crossover
  if(prev5 < prev180 && last5 > last180) sendTelegramAlert(i, "SMA Bullish Crossover (5 vs 180)");
  else if(prev5 > prev180 && last5 < last180) sendTelegramAlert(i, "SMA Bearish Crossover (5 vs 180)");

  // 60 vs 180 crossover
  if(prev60 < prev180 && last60 > last180) sendTelegramAlert(i, "SMA Bullish Crossover (60 vs 180)");
  else if(prev60 > prev180 && last60 < last180) sendTelegramAlert(i, "SMA Bearish Crossover (60 vs 180)");

  // 180 vs 900 crossover
  if(prev180 < prev900 && last180 > last900) sendTelegramAlert(i, "Long Bullish Trend (180 vs 900)");
  else if(prev180 > prev900 && last180 < last900) sendTelegramAlert(i, "Long Bearish Trend (180 vs 900)");

  // Strong condition: 60 crosses both 180 & 900
  let cross180 = (prev60 < prev180 && last60 > last180) || (prev60 > prev180 && last60 < last180);
  let cross900 = (prev60 < prev900 && last60 > last900) || (prev60 > prev900 && last60 < last900);
  if(cross180 && cross900) {
    if(last60 > last180 && last60 > last900) sendTelegramAlert(i, "Strong Bullish Crossover (60 vs 180 & 900)");
    else if(last60 < last180 && last60 < last900) sendTelegramAlert(i, "Strong Bearish Crossover (60 vs 180 & 900)");
  }
    }

    async function fetchCrypto(i, symbol, tf="1m") {
      try {
        const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
        const data = await res.json();
        if(data.price) {
          document.getElementById(`price${i}`).innerText = `$ ${parseFloat(data.price).toLocaleString()}`;
        }
      } catch(e) {
        document.getElementById(`price${i}`).innerText = "Error";
      }
    }

    // LocalStorage save/load
    function saveSettings(i) {
      let sym = document.getElementById(`sym${i}`).value;
      let ind = document.getElementById(`ind${i}`).value;
      let tf  = document.getElementById(`tf${i}`).value;
      localStorage.setItem(`row${i}`, JSON.stringify({sym, ind, tf}));
    }

    function loadSettings(i) {
      let data = localStorage.getItem(`row${i}`);
      if(data) {
        let {sym, ind, tf} = JSON.parse(data);
        document.getElementById(`sym${i}`).value = sym;
        document.getElementById(`ind${i}`).value = ind;
        document.getElementById(`tf${i}`).value  = tf;
      }
    }

    let intervals = {};
    function initRow(i) {
      if(intervals[i]) clearInterval(intervals[i]);
      let sym = document.getElementById(`sym${i}`).value.toUpperCase().trim();
      let tf = document.getElementById(`tf${i}`).value;
      let ind = document.getElementById(`ind${i}`).value;
      intervals[i] = setInterval(() => {
        fetchCrypto(i, sym, tf);
        if(ind === "MACD") checkMACD(i, sym, tf);
        else if(ind === "SMA Alerts") checkSMAAlerts(i, sym, tf);
      }, 10000);
    }

    // Load saved settings on page load
    window.onload = () => {
      symbols.forEach((s, i) => {
        loadSettings(i);
        initRow(i);
      });
    };
  </script>
</body>
</html>
